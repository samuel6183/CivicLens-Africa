<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CivicLens | Records</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f4f7f6;color:#172e35}main{max-width:1000px;margin:auto;padding:24px}header{background:#102e35;color:white;padding:16px}header a{color:white}form{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #9caaa9;border-radius:6px}input{flex:1;min-width:160px}button{background:#146553;color:white;cursor:pointer}article{padding:18px;background:white;border:1px solid #dbe4e1;border-radius:8px;margin:12px 0}a{color:#146553}small{color:#50646a}button:disabled{opacity:.5}</style></head><body><header><a href="/">CivicLens Africa</a> / Data explorer</header><main><h1>Public data explorer</h1><p>Kenya pilot — indexed records with original source links. Coverage depends on completed imports.</p><p id="overview" role="status"></p><form id="form"><input id="q" type="search" aria-label="Search records" placeholder="Search by topic or year"><select id="cat" aria-label="Category"><option value="">All categories</option><option>Economy</option><option>Procurement</option><option>Public finance</option><option>Legislation</option></select><button>Search</button></form><p id="status" role="status"></p><section id="results"></section><button id="prev" disabled>Previous</button> <button id="next" disabled>Next</button><h2>Economic indicators</h2><label for="indicator">Select indicator </label><select id="indicator"><option value="NY.GDP.MKTP.KD.ZG">GDP growth</option><option value="FP.CPI.TOTL.ZG">Inflation</option><option value="SP.POP.TOTL">Population</option></select><div id="series" role="region" aria-label="Indicator observations"></div></main><script>
const $=id=>document.getElementById(id);let offset=0,seq=0;const limit=25;
async function api(path){const r=await fetch(path);if(!r.ok)throw new Error("Request failed");return r.json()}
function line(parent,tag,content){const el=document.createElement(tag);el.textContent=content;parent.append(el);return el}
async function load(){const id=++seq;$("status").textContent="Loading…";$("prev").disabled=$("next").disabled=true;$("results").replaceChildren();try{const p=new URLSearchParams({q:$("q").value,category:$("cat").value,limit,offset});const data=await api("/api/search?"+p);if(id!==seq)return;$("status").textContent=data.total? (offset+1)+"–"+(offset+data.records.length)+" of "+data.total+" records":"No indexed records match. Import data or change your filters.";for(const r of data.records){const a=document.createElement("article");line(a,"small",r.category+" · "+r.publisher);line(a,"h3",r.title);line(a,"p",r.summary);if(r.value!==null)line(a,"p",r.value.toLocaleString(undefined,{maximumFractionDigits:3})+" "+r.unit);line(a,"small","Published: "+(r.published_date||"Not supplied")+" · Retrieved: "+r.retrieved_at.slice(0,10));const u=new URL(r.url);if(u.protocol==="https:"){const link=line(a,"p","");const anchor=line(link,"a","Original source");anchor.href=u.href;anchor.target="_blank";anchor.rel="noopener noreferrer"}$("results").append(a)}$("prev").disabled=offset===0;$("next").disabled=offset+limit>=data.total}catch(e){if(id===seq)$("status").textContent="Data API unavailable. Run the backend or try again."}}
$("form").addEventListener("submit",e=>{e.preventDefault();offset=0;load()});$("prev").onclick=()=>{offset=Math.max(0,offset-limit);load()};$("next").onclick=()=>{offset+=limit;load()};
let seriesSeq=0;async function loadSeries(){const id=++seriesSeq;$("series").textContent="Loading…";try{const data=await api("/api/series?"+new URLSearchParams({indicator:$("indicator").value}));if(id!==seriesSeq)return;$("series").replaceChildren();if(!data.observations.length){line($("series"),"p","No observations imported.");return}const table=document.createElement("table");const head=document.createElement("tr");line(head,"th","Year");line(head,"th","Value");line(head,"th","Unit");table.append(head);for(const r of data.observations){const tr=document.createElement("tr");line(tr,"td",r.period);line(tr,"td",r.value.toLocaleString(undefined,{maximumFractionDigits:3}));line(tr,"td",r.unit);table.append(tr)}$("series").append(table)}catch(e){if(id===seriesSeq)$("series").textContent="Indicator API unavailable."}}
$("indicator").onchange=loadSeries;api("/api/overview").then(d=>{$("overview").textContent=d.counts.reduce((a,r)=>a+r.count,0)+" indexed records · Last retrieval: "+(d.last_retrieved||"Not yet imported")}).catch(()=>{$("overview").textContent="Database status unavailable."});load();loadSeries();
</script></body></html>
